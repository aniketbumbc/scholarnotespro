name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # also allow a manual deploy from the Actions tab

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-vps-scholarnotespro
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/projects/scholarnotespro
            git pull origin main
            docker compose up -d --build
            docker image prune -f
            docker builder prune -f --filter "until=168h"
